<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetEase Cloud Music | Yiyu Mao</title><style>:root{--ink:#113342;--teal:#087f8c}*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:var(--ink);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1120px;margin:auto;padding:28px}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}a{color:var(--teal)}button{margin-left:auto;border:1px solid var(--teal);background:white;border-radius:8px;padding:10px 18px;color:var(--teal);cursor:pointer}h1{font-size:clamp(32px,5vw,60px);line-height:1.15;max-width:950px}h2{line-height:1.3;margin-top:0}.kicker{color:var(--teal);font-size:14px;letter-spacing:.05em}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}.stat{background:#e5efed;border-radius:12px;padding:20px}.stat strong{font-size:38px;display:block}.case{background:white;border-radius:16px;margin:25px 0;padding:30px;border:1px solid #d7e4e5}.sections{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px}.sections h3{font-size:17px;color:var(--teal)}.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:800px;margin:24px auto}.screens img{width:100%;max-width:340px;justify-self:center}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:20px 0}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #dce6e7;padding:12px}th{background:#eaf4f4}footer{font-size:13px;color:#64777e}@media(max-width:650px){header,main,footer{padding:18px}.case{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}.screens{gap:8px}td,th{font-size:13px;padding:8px}}</style><header><nav><strong>YIYU MAO / 毛一羽</strong><a href="README.md">中文文档</a><a href="README.en.md">English documents</a><a href="https://github.com/Ginga2003/netease-cloud-music-product-case">GitHub</a><button id="lang">English</button></nav><div id="intro"></div><nav><a id="pdf" href="downloads/NetEase_Cloud_Music_Case_CN.pdf">案例 PDF</a><a id="docx" href="downloads/NetEase_Cloud_Music_Case_CN.docx">可编辑稿</a><a href="docs/zh/prd.md">Full PRD / 完整版 PRD</a></nav></header><main id="case"></main><footer id="foot"></footer><script>const dataset={"period":"2026-08–2026-09","author":"Yiyu Mao / 毛一羽","repoUrl":"https://github.com/Ginga2003/netease-cloud-music-product-case","pages":[{"cn":{"title":"网易云音乐｜从用户反馈到功能方案","kicker":"产品研究与需求设计 · 2026.08—2026.09","body":"围绕手机端找歌、连续听歌和社区互动，整理问卷与公开反馈，比较 QQ 音乐和 Spotify，并形成带流程、页面状态、业务规则和验收标准的产品需求文档。","stats":[["159","回收问卷"],["110","最终保留样本"],["30","公开用户反馈"],["12","需求组"]],"sections":[["我的工作","问卷设计与结果整理、问题归类与关联分析、需求评分、竞品对比、三项功能 PRD。原始项目材料保留在本地，本案例重新整理为公开展示版。"],["交付状态","研究与需求方案已完成。页面为概念原型，功能尚待现网复测、技术评审和验证；指标与灰度流程为设计方案。"],["样本边界","19 道问卷题；18—30 岁 101 人（91.8%），学生 83 人（75.5%），男性 79 人。样本来自关系网络及转发渠道，结论适用于本次样本。"],["证据如何使用","问卷提供影响范围与群体差异；30 条公开反馈补充具体任务场景。两类材料相互校验，关联结果保留因果解释边界。"]]},"en":{"title":"NetEase Cloud Music","kicker":"User research → scoped product requirements | Aug–Sep 2026","body":"A mobile-product study connecting survey evidence, public feedback, QQ Music and Spotify comparisons to three proposals for music discovery, uninterrupted listening, and report-status transparency.","stats":[["159","responses collected"],["110","retained responses"],["30","public feedback items"],["12","requirement groups"]],"sections":[["My work","Survey design and synthesis, issue classification and association analysis, requirement scoring, competitive comparison, and a three-feature PRD. This case reorganizes the local project artifacts for public review."],["Delivery status","Research and requirements are complete. Screens are conceptual wireframes. Current-version checks, technical review, usability validation and rollout remain future work; metrics describe a validation plan."],["Sample boundaries","19 survey questions. Ages 18–30: 101 (91.8%); students: 83 (75.5%); men: 79. Recruitment used personal networks and forwarding. Findings describe this sample."],["How evidence is used","Survey results estimate reach and segment differences. Thirty public feedback items provide task-level context. Associations inform hypotheses with explicit limits on causal interpretation."]]}},{"cn":{"title":"研究发现｜区分常见摩擦与行为后果","kicker":"基于 110 份保留样本","table":{"headers":["证据","观察结果","产品含义"],"rows":[["搜索使用","109 / 110 人","优先保留清晰的查找与播放路径"],["广告干扰","51 人（46.4%）；评分 2.50 / 5","频次、展示时机、关闭和任务恢复应统一管理"],["页面与入口","37 人（33.6%）；易用评分 2.95 / 5","支持高频入口和可配置模块"],["曲库问题","25 人；其中 23 人报告行为或付费变化","高任务影响；产品方案需区分版权依赖与界面能力"],["会员已过期","32 人中 30 人同时使用竞品","单独观察续费与价值感知"],["推荐重复","64 名推荐用户中 24 人选择重复","保留匹配优势，增加探索与反馈控制"]]},"sections":[["分析方法","分类关联采用 3,000 次置换检验，报告 Cramer’s V；评分与意愿的组间差异报告 epsilon²。对 34 项检验使用 Benjamini–Hochberg FDR 校正。公开版仅呈现汇总结果。"],["解释约束","广告问题较常见，但其与行为变化的关联在 FDR 校正后未达到显著水平。推荐重复集中于仍在活跃使用的用户，结果受问题暴露机会影响。"],["保留已有优势","推荐匹配、歌词同步、播放稳定性和评论故事获得正向反馈。改进重点指向任务中的明确缺口。"]]},"en":{"title":"Separate friction from behavioral consequences","kicker":"Findings from the 110 retained responses","table":{"headers":["Evidence","Sample finding","Product implication"],"rows":[["Search usage","109 of 110 respondents","Protect the path from discovery to playback"],["Promotion friction","51 (46.4%); 2.50 / 5 rating","Unify timing, frequency, dismissal and task recovery"],["Navigation friction","37 (33.6%); usability 2.95 / 5","Prioritize stable core entry points and configurable modules"],["Catalog problems","25; 23 reported behavior/payment changes","Distinguish licensing dependencies from interface scope"],["Lapsed membership","30 of 32 used competing apps","Evaluate renewal value as a separate segment"],["Repeated recommendations","24 of 64 recommendation users","Preserve matching strengths; improve exploration and control"]]},"sections":[["Analysis method","3,000 permutation tests for associations; Cramer’s V for categorical relationships and epsilon-squared for score/intention differences. Benjamini–Hochberg FDR correction covered 34 tests. Public artifacts contain aggregates only."],["Interpretation limits","Advertising was frequent and poorly rated, but its association with reported behavioral change did not remain significant after FDR adjustment. Repetition complaints came from active recommendation users; exposure affects the pattern."],["Preserve existing strengths","Positive feedback highlighted preference matching, synchronized lyrics, stable playback, and comment stories. Proposed improvements target specific gaps within user tasks."]]}},{"cn":{"title":"需求收敛｜从 12 个需求组到三项方案","kicker":"评分结果与最终 PRD 范围分别记录","table":{"headers":["最终方案","对应需求","取舍与优先级"],"rows":[["歌手作品完整浏览与整理","R07","P1；入口、分类、排序及批量操作范围可落地"],["推广干扰控制与模块管理","R02 / R03","P1；先完成当前版本与会员状态复测"],["评论及陌生互动举报反馈","R09 / R10","P0；安全与信任，优先形成可查询闭环"]]},"sections":[["评分框架","影响范围、任务影响、行为影响和证据强度各 1—3 分；直接阻断核心任务或涉及安全的需求进入 P0。R01 包含 A / B 两项子需求，合计 12 个需求组、13 条评分记录。"],["方案修订","早期方案考虑版权解释、云盘批量管理和跨端同步。随后重新检查产品已有能力及具体反馈，将研发依赖较强或证据不足的复杂机制移出最终范围。评分记录保留为决策历史。"],["竞品启发","QQ 音乐作为国内直接竞品，比较检索、内容与会员体系；Spotify 作为产品模式参照，比较资料库组织、推荐控制和跨设备任务。相关观察按 2026 年 8 月 20 日资料截点记录。"],["从对比到产品决策","将功能数量比较转化为任务检查：能否识别作品范围、继续原听歌任务、查询举报处理阶段。版权供给、跨端同步和商业收入分别列出依赖与验证门槛。"]]},"en":{"title":"From 12 requirement groups to three proposals","kicker":"Keep the original scoring record and final PRD scope distinct","table":{"headers":["Final proposal","Requirement lineage","Scope decision"],"rows":[["Complete artist catalog browsing","R07","P1; accessible entries, filters, sort order and explicit batch scope"],["Promotion control and module management","R02 / R03","P1; current-version and membership checks precede development"],["Report progress and interaction safety","R09 / R10","P0; prioritize a traceable safety and trust workflow"]]},"sections":[["Prioritization framework","Reach, task impact, behavioral impact and evidence strength each receive 1–3 points. Core-task blockers and safety issues qualify for P0. R01 has A/B subrequirements: 12 groups and 13 scored entries."],["Scope revision","Early drafts explored licensing explanations, cloud-library batch tools and cross-device synchronization. Rechecking existing capabilities and concrete feedback removed complex mechanisms with weak evidence or heavy dependencies from the final scope. Original scores remain decision history."],["Competitive lenses","QQ Music is the domestic direct competitor for retrieval, content and memberships. Spotify is the product-model reference for library organization, recommendation control and cross-device tasks. Observations retain the August 20, 2026 research cutoff."],["Turn comparisons into decisions","Evaluate whether users can identify operation scope, resume listening, and track report handling. List licensing supply, synchronization and commercial revenue as dependencies with validation gates."]]}},{"cn":{"title":"方案一｜找到作品，确认操作范围","kicker":"P1 · 歌手作品完整浏览与整理","sections":[["主流程","歌手主页 → 全部歌曲 / 全部专辑 → 类型与发行时间筛选 → 播放当前结果或批量加入歌单 → 查看处理明细。"],["关键规则","热门模块明确“热门 50 首”；全部作品入口清晰可达。作品类型不明时归入“其他”。批量处理默认去重，分别反馈成功、已存在、不可加入和失败数量。"],["异常与恢复","分页与后台任务保证大列表可操作；返回页面保留筛选和滚动状态。部分失败支持仅重试失败项，幂等控制避免成功项重复写入。"],["验收与指标","验收核对入口、筛选、播放范围和批量结果。观察完整入口到达率、查找任务完成率、批量成功率和失败项恢复率。"]],"screens":[0,1]},"en":{"title":"Find the catalog. Confirm the operation scope.","kicker":"P1 | Complete artist catalog browsing and organization","sections":[["Main path","Artist page → all songs/albums → filter by type and release date → play current results or add them to a playlist → review outcome details."],["Business rules","Label the popular section “Top 50” and expose the complete catalog. Unknown metadata goes to “Other.” Deduplicate batch additions and report added, existing, unavailable and failed items separately."],["Recovery behavior","Pagination and background tasks keep large catalogs usable. Preserve filters and scroll position when returning. Retry failed items only, using idempotency to avoid duplicate successful writes."],["Acceptance and measures","Check entry visibility, filtering, playback scope and batch outcomes. Track full-catalog entry reach, task completion, batch success and failed-item recovery."]],"screens":[0,1]}},{"cn":{"title":"方案二｜推广关闭后继续原任务","kicker":"P1 · 当前正式版本复测为前置条件","sections":[["展示决策","推广请求依次检查当前任务、播放状态、会话 / 日频次、最近关闭记录、会员权益及素材有效性。普通推广在不适合打断时延后或进入非阻断区域。"],["关闭与频控","同一推广在一次会话内被关闭后停止重复弹出；后台超过 30 分钟结束会话。关闭热区固定、与跳转热区隔离，最小可点击区域按 PRD 为 44 × 44 pt。"],["模块与权益","搜索、播放器、安全和账号入口保持可达；非核心模块允许隐藏、排序和恢复默认。会员权益异常采用低干扰兜底。安全通知独立管理。"],["复测及衡量","按未登录、免费、VIP、SVIP × 启动 / 返回 / 切歌等场景 × 网络状态复测。同期观察重复推广率、任务恢复、关闭误跳转和商业转化。"]],"screens":[2,3]},"en":{"title":"Dismiss the promotion. Resume the task.","kicker":"P1 | Current-release checks are a prerequisite","sections":[["Display decision","Check task context, playback, session/day limits, recent dismissal, membership entitlement and creative validity. Defer ordinary promotions or use a non-blocking area when interruption is inappropriate."],["Dismissal and frequency","After dismissal, the same promotion stays suppressed for the session. A session ends after more than 30 minutes in the background. Separate dismissal from navigation; the PRD specifies a fixed hit area of at least 44 × 44 pt."],["Modules and entitlements","Keep search, playback, safety and account entries accessible. Optional modules can be hidden, reordered and reset. Entitlement failures use a low-interruption fallback; safety notices use separate rules."],["Validation and measures","Retest signed-out, free, VIP and SVIP accounts across launch/return/track-change scenarios and network conditions. Compare repeat exposure, task recovery, accidental navigation and commercial conversion together."]],"screens":[2,3]}},{"cn":{"title":"方案三｜让举报处理过程可查询","kicker":"P0 · 评论与陌生互动安全","sections":[["分流与状态","明确违规进入举报；无关内容进入质量反馈；个人偏好进入不感兴趣。举报在服务端返回案件编号后显示已受理，再进入审核中、待补充和处理结果。"],["即时保护","退出与本机屏蔽优先执行；断网时先隔离，再同步。屏蔽代表个人接触控制。案件审核依据证据与规则进行，举报数量用于线索聚合。"],["隐私和异常","失败请求保留草稿；重复提交指向原案件并允许补充。结果只公开必要类别；通知未送达时仍可从记录中心查询。"],["验收与指标","核对编号、状态一致性、补充材料、可查询结果及离线隔离。观察受理成功率、受理确认时长、处理时长、结果可见率和再次接触阻断失败率。"]],"screens":[4,5]},"en":{"title":"Make report handling visible and traceable.","kicker":"P0 | Comment and stranger-interaction safety","sections":[["Routing and state","Violations go to reporting; unrelated content goes to quality feedback; personal dislikes go to preference controls. Show “Accepted” only after the server returns a case ID, followed by review, additional-information requests and an outcome."],["Immediate protection","Exit and local blocking take effect first. During network failure, isolate locally and sync later. Blocking is personal contact control. Moderation uses evidence and rules; report volume supports triage."],["Privacy and failures","Keep unsuccessful submissions as drafts. Repeated submissions open the existing case with an option to add evidence. Disclose necessary outcome categories; the record center remains available when notifications fail."],["Acceptance and measures","Check IDs, consistent states, evidence supplementation, queryable outcomes and offline isolation. Measure acceptance success/latency, handling time, outcome visibility and post-block contact failures."]],"screens":[4,5]}},{"cn":{"title":"验证计划与交付证据","kicker":"设计可验证的后续步骤","table":{"headers":["阶段","验证内容","决策条件"],"rows":[["现状核验","当前版本复测；14 天指标基线","移除已解决或无法复现的问题"],["小范围灰度","各功能分阶段开放，保留回退开关","同步评估任务体验、性能、商业及安全"],["效果评估","检查成功率、异常、处理时长与护栏","依据基线确定目标；重大失败时暂停扩量"]]},"sections":[["交付材料","用户研究汇总、需求分析与优先级矩阵、QQ 音乐 / Spotify 竞品分析、完整版 PRD；补充本次整理的中英文案例与六组可视化概念原型。"],["需求可追溯","场景 → 流程 → 原型 → 埋点 → 验收逐项对应。完整版 PRD 第十六节保留对应表，展示版将三条任务链路单独说明。"],["实施依赖","内容元数据与歌单服务、客户端与广告 SDK、会员权益服务、审核状态接口、客服运营与数据团队。每项依赖都对应失效处理。"],["公开展示边界","公开仓库保留汇总数据与产品文档；逐人问卷、联系方式、私人证明材料和过程缓存留在本地。项目为个人产品分析练习，使用网易云音乐作为研究对象。"],["项目入口","https://github.com/Ginga2003/netease-cloud-music-product-case"]]},"en":{"title":"Validation plan and delivery evidence","kicker":"Define reviewable next steps","table":{"headers":["Stage","Checks","Decision gate"],"rows":[["Baseline","Current-release verification and 14-day measures","Remove resolved or unreproducible issues"],["Limited rollout","Release in stages with rollback switches","Evaluate task experience, performance, revenue and safety"],["Evaluation","Success rates, failures, handling times and guardrails","Set targets from baseline; pause expansion on serious failures"]]},"sections":[["Artifacts","Research synthesis; needs analysis and priority matrix; QQ Music/Spotify comparison; full Chinese PRD; this bilingual case and six visual concept wireframes reorganized from the final PRD."],["Traceability","Scenario → flow → prototype → event → acceptance criterion. Section 16 of the full PRD contains the mapping; this case explains the three task chains separately."],["Implementation dependencies","Content metadata and playlist services, client/ad SDK behavior, membership entitlements, moderation-state APIs, customer operations and analytics. Each dependency has a failure-handling rule."],["Public scope","The repository contains aggregate results and product documents. Individual survey rows, contacts, private verification documents and working caches stay local. This is a personal product-analysis exercise studying NetEase Cloud Music."],["Project repository","https://github.com/Ginga2003/netease-cloud-music-product-case"]]}}]};let language='cn';function el(tag,text,parent){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}function render(){document.documentElement.lang=language==='cn'?'zh-CN':'en';document.getElementById('lang').textContent=language==='cn'?'English':'中文';let v=dataset.pages[0][language],intro=document.getElementById('intro');intro.replaceChildren();el('p',v.kicker,intro).className='kicker';el('h1',v.title,intro);el('p',v.body,intro);let stats=el('div',undefined,intro);stats.className='stats';for(let [a,b] of v.stats){let c=el('div',undefined,stats);c.className='stat';el('strong',a,c);el('span',b,c)}let main=document.getElementById('case');main.replaceChildren();for(let [i,p] of dataset.pages.entries()){let x=p[language],section=el('section',undefined,main);section.className='case';el('p',String(i+1).padStart(2,'0')+' / '+x.kicker,section).className='kicker';el('h2',i===0?(language==='cn'?'项目背景与证据边界':'Context and evidence boundaries'):x.title,section);if(x.table){let wrap=el('div',undefined,section);wrap.className='table-wrap';let t=el('table',undefined,wrap),head=el('thead',undefined,t),r=el('tr',undefined,head);for(let h of x.table.headers)el('th',h,r);let body=el('tbody',undefined,t);for(let row of x.table.rows){let tr=el('tr',undefined,body);for(let c of row)el('td',c,tr)}}let text=el('div',undefined,section);text.className='sections';for(let [h,b] of x.sections){let card=el('div',undefined,text);el('h3',h,card);el('p',b,card)}if(x.screens){let imgs=el('div',undefined,section);imgs.className='screens';for(let j of x.screens){let img=el('img',undefined,imgs);img.src='assets/wireframes/'+(language==='cn'?'zh':'en')+'/'+String(j+1).padStart(2,'0')+'.png';img.alt=language==='cn'?'概念原型 '+(j+1):'Concept wireframe '+(j+1)}}}document.getElementById('pdf').href='downloads/NetEase_Cloud_Music_Case_'+(language==='cn'?'CN':'EN')+'.pdf';document.getElementById('pdf').textContent=language==='cn'?'案例 PDF':'Case PDF';document.getElementById('docx').href='downloads/NetEase_Cloud_Music_Case_'+(language==='cn'?'CN':'EN')+'.docx';document.getElementById('docx').textContent=language==='cn'?'可编辑稿':'Editable DOCX';document.getElementById('foot').textContent=language==='cn'?'2026.10.11 整理发布。个人产品分析练习；概念原型与汇总研究数据，效果待验证。':'Published October 11, 2026. Personal product-analysis exercise; concept wireframes and aggregate findings. Effects require validation.'}document.getElementById('lang').onclick=()=>{language=language==='cn'?'en':'cn';render()};render();</script></html>
