<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#ffffff"/>
  <text x="700" y="50" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">用户近期遇到的主要问题（前10项）</text>
  <text x="700" y="80" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">第9题为多选题，各项比例之和可以超过100%</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <text x="430" y="140" text-anchor="end" font-size="15" fill="#334155">广告、弹窗或活动提示影响使用</text><rect x="450" y="116" width="650" height="34" rx="6" fill="#DC2626"/><text x="1113" y="140" font-size="16" font-weight="700" fill="#172033">51人（46.4%）</text>
    <text x="430" y="202" text-anchor="end" font-size="15" fill="#334155">页面信息较多或功能入口难找</text><rect x="450" y="178" width="471" height="34" rx="6" fill="#F97316"/><text x="934" y="202" font-size="16" font-weight="700" fill="#172033">37人（33.6%）</text>
    <text x="430" y="264" text-anchor="end" font-size="15" fill="#334155">会员价格、权益或付费规则不符合预期</text><rect x="450" y="240" width="331" height="34" rx="6" fill="#F59E0B"/><text x="794" y="264" font-size="16" font-weight="700" fill="#172033">26人（23.6%）</text>
    <text x="430" y="326" text-anchor="end" font-size="15" fill="#334155">想听的歌曲无法播放或未能找到</text><rect x="450" y="302" width="318" height="34" rx="6" fill="#F59E0B"/><text x="781" y="326" font-size="16" font-weight="700" fill="#172033">25人（22.7%）</text>
    <text x="430" y="388" text-anchor="end" font-size="15" fill="#334155">推荐歌曲重复或缺乏新鲜感</text><rect x="450" y="364" width="306" height="34" rx="6" fill="#F59E0B"/><text x="769" y="388" font-size="16" font-weight="700" fill="#172033">24人（21.8%）</text>
    <text x="430" y="450" text-anchor="end" font-size="15" fill="#334155">搜索结果不符合需要</text><rect x="450" y="426" width="140" height="34" rx="6" fill="#3B82F6"/><text x="603" y="450" font-size="16" font-weight="700" fill="#172033">11人（10.0%）</text>
    <text x="430" y="512" text-anchor="end" font-size="15" fill="#334155">推荐内容不符合个人喜好</text><rect x="450" y="488" width="127" height="34" rx="6" fill="#3B82F6"/><text x="590" y="512" font-size="16" font-weight="700" fill="#172033">10人（9.1%）</text>
    <text x="430" y="574" text-anchor="end" font-size="15" fill="#334155">歌单、收藏、下载或同步操作不方便</text><rect x="450" y="550" width="89" height="34" rx="6" fill="#60A5FA"/><text x="552" y="574" font-size="16" font-weight="700" fill="#172033">7人（6.4%）</text>
    <text x="430" y="636" text-anchor="end" font-size="15" fill="#334155">加载慢、播放中断、卡顿或闪退</text><rect x="450" y="612" width="76" height="34" rx="6" fill="#60A5FA"/><text x="539" y="636" font-size="16" font-weight="700" fill="#172033">6人（5.5%）</text>
    <text x="430" y="698" text-anchor="end" font-size="15" fill="#334155">歌曲评论内容质量不理想</text><rect x="450" y="674" width="76" height="34" rx="6" fill="#60A5FA"/><text x="539" y="698" font-size="16" font-weight="700" fill="#172033">6人（5.5%）</text>
  </g>
  <text x="700" y="760" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" fill="#657086">广告干扰和页面入口问题在最终样本中最集中</text>
</svg>
