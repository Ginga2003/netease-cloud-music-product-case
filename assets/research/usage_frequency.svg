<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <rect width="1200" height="590" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">网易云音乐使用频率（n=110）</text>
  <text x="600" y="80" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">第3题：过去一个月的使用频率</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <text x="270" y="145" text-anchor="end" font-size="17" fill="#334155">几乎每天</text><rect x="295" y="114" width="594" height="44" rx="7" fill="#2563EB"/><text x="910" y="142" font-size="17" font-weight="700" fill="#172033">33人（30.0%）</text>
    <text x="270" y="215" text-anchor="end" font-size="17" fill="#334155">每周4—6天</text><rect x="295" y="184" width="468" height="44" rx="7" fill="#3B82F6"/><text x="784" y="212" font-size="17" font-weight="700" fill="#172033">26人（23.6%）</text>
    <text x="270" y="285" text-anchor="end" font-size="17" fill="#334155">每周1—3天</text><rect x="295" y="254" width="396" height="44" rx="7" fill="#60A5FA"/><text x="712" y="282" font-size="17" font-weight="700" fill="#172033">22人（20.0%）</text>
    <text x="270" y="355" text-anchor="end" font-size="17" fill="#334155">每月1—3次</text><rect x="295" y="324" width="252" height="44" rx="7" fill="#10B981"/><text x="568" y="352" font-size="17" font-weight="700" fill="#172033">14人（12.7%）</text>
    <text x="270" y="425" text-anchor="end" font-size="17" fill="#334155">已经停止使用</text><rect x="295" y="394" width="234" height="44" rx="7" fill="#F59E0B"/><text x="550" y="422" font-size="17" font-weight="700" fill="#172033">13人（11.8%）</text>
    <text x="270" y="495" text-anchor="end" font-size="17" fill="#334155">很少使用</text><rect x="295" y="464" width="36" height="44" rx="7" fill="#CBD5E1"/><text x="352" y="492" font-size="17" font-weight="700" fill="#172033">2人（1.8%）</text>
  </g>
  <text x="600" y="555" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" fill="#657086">每周至少使用1天的用户共81人，占73.6%</text>
</svg>
