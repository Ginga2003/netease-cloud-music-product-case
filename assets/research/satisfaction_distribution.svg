<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">总体满意度分布（n=110）</text>
  <text x="600" y="82" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">第7题：对网易云音乐手机端总体使用体验的评价</text>
  <g transform="translate(100 145)">
    <rect x="0" y="0" width="36" height="92" fill="#047857"/><rect x="36" y="0" width="409" height="92" fill="#10B981"/><rect x="445" y="0" width="427" height="92" fill="#94A3B8"/><rect x="872" y="0" width="128" height="92" fill="#F59E0B"/>
    <text x="240" y="56" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">满意 44.5%</text>
    <text x="658" y="56" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">一般 42.7%</text>
    <text x="936" y="56" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">不满意 12.7%</text>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#334155">
    <rect x="176" y="300" width="18" height="18" rx="3" fill="#047857"/><text x="205" y="315">非常满意：4人（3.6%）</text>
    <rect x="422" y="300" width="18" height="18" rx="3" fill="#10B981"/><text x="451" y="315">比较满意：45人（40.9%）</text>
    <rect x="708" y="300" width="18" height="18" rx="3" fill="#94A3B8"/><text x="737" y="315">一般：47人（42.7%）</text>
    <rect x="938" y="300" width="18" height="18" rx="3" fill="#F59E0B"/><text x="967" y="315">比较不满意：14人（12.7%）</text>
  </g>
  <text x="600" y="385" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">样本中没有“非常不满意”选项</text>
</svg>
