<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">选择某类问题后，用户行为是否发生变化</text>
  <text x="700" y="84" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">行为变化包括减少使用、转向其他App、停止使用或降低付费/续费意愿</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><line x1="330" y1="115" x2="330" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="330" y="760" text-anchor="middle" font-size="13" fill="#657086">0%</text><line x1="510" y1="115" x2="510" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="510" y="760" text-anchor="middle" font-size="13" fill="#657086">20%</text><line x1="690" y1="115" x2="690" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="690" y="760" text-anchor="middle" font-size="13" fill="#657086">40%</text><line x1="870" y1="115" x2="870" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="870" y="760" text-anchor="middle" font-size="13" fill="#657086">60%</text><line x1="1050" y1="115" x2="1050" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="1050" y="760" text-anchor="middle" font-size="13" fill="#657086">80%</text><line x1="1230" y1="115" x2="1230" y2="735" stroke="#E3E8F0" stroke-width="1"/><text x="1230" y="760" text-anchor="middle" font-size="13" fill="#657086">100%</text><text x="300" y="172" text-anchor="end" font-size="18" font-weight="700" fill="#334155">广告干扰</text><rect x="330" y="145" width="564.75" height="24" rx="5" fill="#DC2626"/><text x="906.75" y="163" font-size="15" font-weight="700" fill="#172033">62.7%</text><rect x="330" y="177" width="472.85999999999996" height="24" rx="5" fill="#94A3B8"/><text x="814.8599999999999" y="195" font-size="15" font-weight="700" fill="#172033">52.5%</text><text x="300" y="317" text-anchor="end" font-size="18" font-weight="700" fill="#334155">页面查找</text><rect x="330" y="290" width="583.74" height="24" rx="5" fill="#DC2626"/><text x="925.74" y="308" font-size="15" font-weight="700" fill="#172033">64.9%</text><rect x="330" y="322" width="480.78000000000003" height="24" rx="5" fill="#94A3B8"/><text x="822.78" y="340" font-size="15" font-weight="700" fill="#172033">53.4%</text><text x="300" y="462" text-anchor="end" font-size="18" font-weight="700" fill="#334155">曲库缺失</text><rect x="330" y="435" width="828" height="24" rx="5" fill="#DC2626"/><text x="1170" y="453" font-size="15" font-weight="700" fill="#172033">92.0%</text><rect x="330" y="467" width="423.54" height="24" rx="5" fill="#94A3B8"/><text x="765.54" y="485" font-size="15" font-weight="700" fill="#172033">47.1%</text><text x="300" y="607" text-anchor="end" font-size="18" font-weight="700" fill="#334155">会员权益</text><rect x="330" y="580" width="796.1400000000001" height="24" rx="5" fill="#DC2626"/><text x="1138.14" y="598" font-size="15" font-weight="700" fill="#172033">88.5%</text><rect x="330" y="612" width="428.58" height="24" rx="5" fill="#94A3B8"/><text x="770.5799999999999" y="630" font-size="15" font-weight="700" fill="#172033">47.6%</text><g transform="translate(390,112)"><rect x="0" y="-10" width="18" height="18" rx="4" fill="#DC2626"/><text x="27" y="4" font-size="15" fill="#334155">选择该问题</text><rect x="235" y="-10" width="18" height="18" rx="4" fill="#94A3B8"/><text x="262" y="4" font-size="15" fill="#334155">未选择该问题</text></g></g>
  <text x="700" y="792" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" fill="#657086">曲库问题和会员权益问题与行为变化的关联较强；广告和页面问题的组间差异未达到FDR校正后的显著水平。</text>
</svg>