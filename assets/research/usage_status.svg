<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">网易云音乐使用状态（n=110）</text>
  <text x="600" y="82" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#657086">53人作为最常用应用，另有43人仍使用但已不是最常用</text>
  <line x1="280" y1="130" x2="280" y2="415" stroke="#C9D1DD"/>
  <line x1="280" y1="415" x2="940" y2="415" stroke="#C9D1DD"/>
  <text x="255" y="180" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#334155">最常使用</text>
  <rect x="280" y="145" width="583" height="52" rx="8" fill="#3B82F6"/>
  <text x="880" y="178" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">53人（48.2%）</text>
  <text x="255" y="275" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#334155">仍使用，非最常用</text>
  <rect x="280" y="240" width="473" height="52" rx="8" fill="#10B981"/>
  <text x="770" y="273" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">43人（39.1%）</text>
  <text x="255" y="370" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#334155">已经停止使用</text>
  <rect x="280" y="335" width="154" height="52" rx="8" fill="#F59E0B"/>
  <text x="451" y="368" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">14人（12.7%）</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13" fill="#657086">
    <text x="280" y="440" text-anchor="middle">0</text><text x="390" y="440" text-anchor="middle">10</text><text x="500" y="440" text-anchor="middle">20</text><text x="610" y="440" text-anchor="middle">30</text><text x="720" y="440" text-anchor="middle">40</text><text x="830" y="440" text-anchor="middle">50</text><text x="940" y="440" text-anchor="middle">60</text>
